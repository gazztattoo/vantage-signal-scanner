name: GLOBAL SIGNAL SCANNER — calendario escalonado y ventana de 7 días

on:
  # Dos disparos por hora. El runner decide qué mercados/timeframes vencen.
  # Oro M5 cada 30 min; oro M15 cada 2 h; EUR/BTC M5+M15 cada 3 h.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantage-signal-scanner-cron
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar escáner
        env:
          SCANNER_API_URL: https://vantage-signal-api-carlos.onrender.com
          SIGNAL_CRON_SECRET: ${{ secrets.SIGNAL_CRON_SECRET }}
          SCANNER_TRIAL_START_UTC: "2026-11-13T17:00:00Z"
          SCANNER_TRIAL_END_UTC: "2026-11-20T17:00:00Z"
        run: |
          if [ -z "$SIGNAL_CRON_SECRET" ]; then
            echo "::error::Falta configurar el secreto SIGNAL_CRON_SECRET en GitHub."
            exit 1
          fi
          python scripts/run_signal_scan.py
