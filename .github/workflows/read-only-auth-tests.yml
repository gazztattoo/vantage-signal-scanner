name: Read-only Auth Tests

on:
  push:
    branches:
      - mcp-readonly-auth-test
  pull_request:
    branches:
      - mcp-readonly-test
      - mcp-readonly-auth-test

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run read-only authorization tests
        run: python -m unittest discover -s tests -v
