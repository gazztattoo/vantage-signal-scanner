name: GLOBAL SIGNAL SCANNER — producción pausada

on:
  # Sin cron ni activación por push. Solo ejecución manual y fail-closed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantage-signal-scanner-cron
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar pausa del escáner
        env:
          SCANNER_ENABLED: "false"
        run: python scripts/run_signal_scan.py
