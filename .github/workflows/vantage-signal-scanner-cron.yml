name: GLOBAL SIGNAL SCANNER — prueba controlada de 7 días

on:
  # Prueba autorizada: un ciclo cada 2 horas. El script aplica un corte UTC
  # obligatorio para que ninguna ejecución consulte la API fuera de la ventana.
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantage-signal-scanner-cron
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar escáner
        env:
          SCANNER_API_URL: https://vantage-signal-api-carlos.onrender.com
          SIGNAL_CRON_SECRET: ${{ secrets.SIGNAL_CRON_SECRET }}
          SCANNER_TRIAL_START_UTC: "2026-11-04T12:42:00Z"
          SCANNER_TRIAL_END_UTC: "2026-11-11T12:42:00Z"
        run: |
          if [ -z "$SIGNAL_CRON_SECRET" ]; then
            echo "::error::Falta configurar el secreto SIGNAL_CRON_SECRET en GitHub."
            exit 1
          fi
          python scripts/run_signal_scan.py
