name: Prealert offline tests

on:
  push:
    branches: [prealert-offline-ci-test]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provider-free prealert tests
        run: python -m unittest discover -s tests -p "test_prealert*.py" -v
