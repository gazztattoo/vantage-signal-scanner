name: Biquote live validation (isolated)

on:
  push:
    branches:
      - biquote-live-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4

      - name: Validate Biquote quotes and OHLC (10 requests max)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = "https://biquote.io"
          SYMBOLS = ("EURUSD", "XAUUSD", "BTCUSD")
          INTERVALS = {"5m": 5, "15m": 15, "30m": 30}
          failures = []

          def get_json(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urlencode(params, doseq=True)
              req = Request(url, headers={"User-Agent": "GlobalSignalScanner-Biquote-Validation/1.0"})
              with urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          # One batched quote request for all three instruments.
          try:
              quotes = get_json("/api/latest", [("symbols", s) for s in SYMBOLS])
              if not isinstance(quotes, dict):
                  raise RuntimeError("Respuesta de cotizaciones no es un objeto JSON")
              for symbol in SYMBOLS:
                  q = quotes.get(symbol)
                  if not isinstance(q, dict):
                      failures.append(f"{symbol}: falta cotización")
                      continue
                  bid, ask = q.get("bid"), q.get("ask")
                  if not isinstance(bid, (int, float)) or not isinstance(ask, (int, float)) or bid <= 0 or ask < bid:
                      failures.append(f"{symbol}: Bid/Ask inválidos")
                      continue
                  age = q.get("quoteAgeSeconds")
                  state = q.get("marketState", "unknown")
                  print(f"QUOTE {symbol}: bid={bid} ask={ask} state={state} age_s={age}")
          except Exception as exc:
              failures.append(f"quotes batch: {type(exc).__name__}: {exc}")

          # Nine OHLC requests: 3 symbols x 3 supported timeframes.
          for symbol in SYMBOLS:
              for interval, minutes in INTERVALS.items():
                  try:
                      payload = get_json(f"/api/{symbol}/ohlc", {"interval": interval, "limit": 120})
                      bars = payload.get("bars") if isinstance(payload, dict) else None
                      if not isinstance(bars, list):
                          raise RuntimeError("No existe el array bars")
                      closed = [b for b in bars if isinstance(b, dict) and b.get("isOpen") is False]
                      if len(closed) < 55:
                          raise RuntimeError(f"Solo {len(closed)} velas cerradas; se requieren al menos 55")
                      newest = max(closed, key=lambda b: b.get("openTime", ""))
                      stamp = datetime.fromisoformat(str(newest["openTime"]).replace("Z", "+00:00"))
                      if stamp.tzinfo is None:
                          raise RuntimeError("openTime sin zona horaria")
                      age_minutes = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds() / 60
                      max_age = max(minutes * 2.5, 20)
                      if age_minutes < -minutes or age_minutes > max_age:
                          raise RuntimeError(f"Última vela cerrada demasiado antigua/futura: {age_minutes:.1f} min")
                      for field in ("open", "high", "low", "close"):
                          value = newest.get(field)
                          if not isinstance(value, (int, float)) or value <= 0:
                              raise RuntimeError(f"Campo {field} inválido")
                      if newest["high"] < max(newest["open"], newest["close"]) or newest["low"] > min(newest["open"], newest["close"]):
                          raise RuntimeError("OHLC inconsistente")
                      print(f"OHLC {symbol} {interval}: bars={len(bars)} closed={len(closed)} newest={newest['openTime']} age_min={age_minutes:.1f}")
                  except Exception as exc:
                      failures.append(f"{symbol} {interval}: {type(exc).__name__}: {exc}")

          print(f"\nRESULT: {9 - sum(1 for x in failures if any(f'{s} {i}' in x for s in SYMBOLS for i in INTERVALS))}/9 OHLC checks; {len(failures)} issue(s).")
          if failures:
              print("ISSUES:")
              for failure in failures:
                  print(" - " + failure)
              sys.exit(1)
          print("PASS: quotes and all nine OHLC combinations passed.")
          PY
