name: GLOBAL SIGNAL SCANNER — producción (GitHub Actions)

on:
  push:
    paths:
      - ".github/workflows/vantage-signal-scanner-cron.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantage-signal-scanner-cron
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar escáner de producción
        env:
          SCANNER_ENABLED: "false"
          SCANNER_TRIAL_START_UTC: "2026-11-16T00:00:00Z"
          SCANNER_TRIAL_END_UTC: "2026-11-23T23:59:00Z"
          SCANNER_API_URL: "https://vantage-signal-api-carlos.onrender.com"
          SIGNAL_CRON_SECRET: ${{ secrets.SIGNAL_CRON_SECRET }}
        run: python scripts/run_signal_scan.py
