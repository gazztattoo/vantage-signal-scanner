name: Gedeon 2.0 — research validation

on:
  push:
    paths:
      - "research/**"
      - "tests/test_gold_*.py"
      - "gold_news.py"
      - ".github/workflows/gedeon-research-validation.yml"
  pull_request:
    paths:
      - "research/**"
      - "tests/test_gold_*.py"
      - "gold_news.py"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependency
        run: python -m pip install requests
      - name: Run isolated research tests
        env:
          PYTHONPATH: research
        run: |
          python -m unittest discover -s tests -p 'test_gold_liquidity_research.py' -v
          python -m unittest discover -s tests -p 'test_gold_strategy_backtest*.py' -v
