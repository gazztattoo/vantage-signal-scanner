name: Production scanner secret preflight (no market data)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scanner-secret-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check GitHub-to-Render authentication without scanning
        env:
          SIGNAL_CRON_SECRET: ${{ secrets.SIGNAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNAL_CRON_SECRET" ]; then
            echo "::error::SIGNAL_CRON_SECRET is missing in GitHub."
            exit 1
          fi
          status=$(curl -sS --max-time 30 -o /tmp/preflight-result -w "%{http_code}" \
            -X POST "https://vantage-signal-api-carlos.onrender.com/api/cron-auth-check" \
            -H "X-Scanner-Cron-Secret: $SIGNAL_CRON_SECRET")
          if [ "$status" != "200" ]; then
            echo "::error::Cron secret preflight failed (HTTP $status). No market requests were sent."
            exit 1
          fi
          echo "Cron authentication validated. No market requests were sent."
