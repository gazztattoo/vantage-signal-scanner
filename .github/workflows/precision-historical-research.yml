name: VANTAGE precision historical research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical calendar days to download (14-56)"
        required: true
        default: "28"

permissions:
  contents: read

concurrency:
  group: vantage-precision-historical-research
  cancel-in-progress: false

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile downloader
        run: python -m py_compile research/download_dukascopy_m1.py
      - name: Compile research backtest
        run: python -m py_compile research/backtest_precision.py
      - name: Run research tests
        run: python -m unittest discover -s tests -p "test_*precision*.py" -v && python -m unittest discover -s tests -p "test_dukascopy_downloader.py" -v
      - name: Download public historical bid/ask candles
        run: python research/download_dukascopy_m1.py --days "${{ inputs.days || '28' }}"
      - name: Run spread-aware strategy experiments
        run: |
          for symbol in EURUSD XAUUSD BTCUSD; do
            input="research_data/dukascopy_m1/${symbol}_M1_BID_ASK.csv"
            if [ -s "$input" ]; then
              python research/backtest_precision.py "$input" --symbol "$symbol" --out "research_data/dukascopy_m1/${symbol}_precision_report.json"
            else
              echo "No BID/ASK history for $symbol; skipping this instrument."
            fi
          done
      - name: Upload research dataset and reports
        uses: actions/upload-artifact@v4
        with:
          name: vantage-dukascopy-m1-bid-ask
          path: research_data/dukascopy_m1/
          if-no-files-found: error
          retention-days: 14
