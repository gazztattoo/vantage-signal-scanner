name: Production parity candidate tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [production-parity-candidate]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN_SECRET: precision-ci-only-secret
      PANEL_ACCESS_CODE: precision-ci-only-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
