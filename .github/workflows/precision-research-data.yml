name: Precision research data (free historical feed)

on:
  push:
    branches: [vantage-precision-research]
    paths:
      - ".github/workflows/precision-research-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-free-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download EURUSD M1 history (Dukascopy public feed)
        run: npx --yes dukascopy-node -i eurusd -from 2026-10-01 -to 2026-11-03 -t m1 -f csv -v
      - name: Download XAUUSD M1 history (Dukascopy public feed)
        run: npx --yes dukascopy-node -i xauusd -from 2026-10-01 -to 2026-11-03 -t m1 -f csv -v
      - name: Download BTCUSD M1 history (Dukascopy public feed)
        run: npx --yes dukascopy-node -i btcusd -from 2026-10-01 -to 2026-11-03 -t m1 -f csv -v
      - name: Package research data
        run: |
          test -d download
          ls -lh download
          zip -r vantage-free-history-2026-10-01-to-2026-11-03.zip download
      - uses: actions/upload-artifact@v4
        with:
          name: vantage-free-history-2026-10-01-to-2026-11-03
          path: vantage-free-history-2026-10-01-to-2026-11-03.zip
          retention-days: 7
