name: Precision Engine V2 isolated tests

on:
  push:
    branches: [precision-engine-v2]
    paths:
      - "precision_engine_v2.py"
      - "anticipatory_signal_v2.py"
      - "tests/test_anticipatory_signal_v2.py"
      - "panel_escaner_vantage.html"
      - "tests/test_panel_script.py"
      - "external_signal_intelligence.py"
      - "external_technical_signal_adapters.py"
      - "external_biquote_adapter.py"
      - "tests/test_precision_engine_v2.py"
      - "tests/test_precision_candidate_endpoint.py"
      - "app.py"
      - "tests/test_external_signal_intelligence.py"
      - "tests/test_external_technical_signal_adapters.py"
      - "tests/test_external_biquote_adapter.py"
      - ".github/workflows/precision-engine-v2-tests.yml"

permissions:
  contents: read

jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API test dependencies
        run: pip install flask requests flask-cors itsdangerous
      - name: Check panel JavaScript syntax and isolated unit tests (no market data or secrets)
        env:
          ACCESS_TOKEN_SECRET: precision-test-secret
          PANEL_ACCESS_CODE: precision-test-code
        run: |
          python -m unittest discover -s tests -p "test_panel_script.py" -v
          python -m unittest discover -s tests -p "test_precision_engine_v2.py" -v
          python -m unittest discover -s tests -p "test_anticipatory_signal_v2.py" -v
          python -m unittest discover -s tests -p "test_precision_candidate_endpoint.py" -v
          python -m unittest discover -s tests -p "test_external_signal_intelligence.py" -v
          python -m unittest discover -s tests -p "test_external_technical_signal_adapters.py" -v
          python -m unittest discover -s tests -p "test_external_biquote_adapter.py" -v
